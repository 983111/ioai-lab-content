<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;gap:24px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:500;letter-spacing:-.02em;background:none;border:0;padding:0;white-space:nowrap}
.sub{padding-left:24px;border-left:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap}
.search{flex:1;max-width:442px;margin:0 auto;display:flex;align-items:center;gap:10px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:16px;color:var(--mut)}

.foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:10px;color:var(--mut);line-height:1.9}.foot b{color:var(--ink);font-weight:500;font-size:11px}

main{padding:26px 24px 40px;min-width:0}

.eb{font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
h1{margin:10px 0 18px;font-size:40px;line-height:1.1;font-weight:500;letter-spacing:-.025em}
h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}h3{margin:0;font-size:13px;font-weight:500}
.mut{color:var(--mut)}.sm{font-size:11px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 394px 150px;gap:24px;align-items:start}
.hero p{max-width:350px;color:var(--mut);margin:0 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 20px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:12px}
.btn.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}.btn:hover{opacity:.85}.btn.sm2{height:30px;padding:0 12px}
.art{width:100%;height:250px;border-radius:2px;display:block}
.cap h3{font-size:16px;margin-top:50px}.cap div{font-size:10px;color:var(--mut)}
.stats{display:flex;align-items:center;gap:56px;margin:28px 0;padding:22px 0 0;border-top:1px solid var(--line)}
.stats b{display:block;font-size:16px;font-weight:600}.stats span{font-size:11px;color:var(--mut)}
.leg{margin-left:auto;display:flex;gap:20px;font-size:10px;color:var(--mut)}.leg i,.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px}
.sec{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.sec p{margin:2px 0 0;color:var(--mut);font-size:11px}
.link{background:none;border:0;padding:0;font-size:11px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}.link svg{width:12px;height:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:30px}
.card{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:18px 16px 14px;text-align:left;display:block;width:100%}
button.card:hover{border-color:var(--mut)}
.card .ic{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;margin-bottom:22px}
.card .go{position:absolute;right:14px;top:16px;width:13px;height:13px;color:var(--mut)}
.card p{margin:6px 0 24px;font-size:11px;color:var(--mut);min-height:34px}
.meta{font-size:10px;color:var(--mut);margin-bottom:6px}
.bar{display:flex;align-items:center;gap:14px;font-size:9px;color:var(--mut)}.bar u{flex:1;height:3px;border-radius:2px;background:var(--line);text-decoration:none;overflow:hidden}.bar u s{display:block;height:100%;background:var(--ink);width:0}
.nb{padding:10px}.th{height:62px;border-radius:3px;background:var(--bg2);margin-bottom:10px;display:flex;align-items:flex-end;gap:5px;padding:8px}.th i{flex:1;background:var(--line);border-radius:2px}
.tag{display:inline-block;font-size:9px;padding:1px 7px;border-radius:3px;margin-bottom:6px}
.t-g{background:#e4f6ec;color:#16803f}.t-b{background:#e5edff;color:#2f55c7}.t-v{background:#ece8fb;color:#5b3fc0}.t-a{background:#fdf1d8;color:#a06a00}
:root[data-theme="dark"] .tag{filter:brightness(.9)}
.nb p{margin:4px 0 12px;min-height:32px}.nb .meta{display:flex;justify-content:space-between;margin:0;padding:0 2px}
.pan{border:1px solid var(--line);border-radius:8px;padding:16px}.pan h2{font-size:15px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.prog{display:flex;align-items:center;gap:22px}.prog dl{margin:0;display:grid;gap:14px;border-left:1px solid var(--line);padding-left:22px}
.prog dt{font-size:13px;font-weight:600;display:inline}.prog dd{margin:0;font-size:10px;color:var(--mut)}
.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:21px;font-weight:500}.ring span{font-size:8px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px}
.empty{padding:26px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:8px}.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.prep{position:relative;overflow:hidden;min-height:196px}.prep h2{font-size:19px;line-height:1.3;margin:6px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{height:30px;padding:0 14px;border:1px solid var(--line);border-radius:15px;background:var(--bg);font-size:12px}.chip.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.page h1{font-size:30px;margin:0 0 4px}.page>p{margin:0 0 22px;color:var(--mut)}
.list{display:grid;gap:10px}.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:6px}.li .g{flex:1}
.pg{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}
label{display:block;font-size:11px;color:var(--mut);margin:0 0 6px}.fld{margin-bottom:16px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:9px 12px;outline:0}textarea{resize:vertical;min-height:140px}
input[type=range]{width:100%;accent-color:var(--ink)}
.out{min-height:240px;white-space:pre-wrap;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:20;background:var(--sh);display:grid;place-items:center;padding:20px}.mb{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:min(440px,100%);padding:22px}.mb p{color:var(--mut)}.mb .ac{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:6px;font-size:12px;z-index:30}
.doc h2{margin:22px 0 6px}.doc p{max-width:600px;color:var(--mut);margin:0}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:24px}.g2 .card{height:100%}
.lv{display:inline-block;font-size:10px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);margin-right:8px;white-space:nowrap}.lv.Beginner{border-color:var(--g)}.lv.Intermediate{border-color:var(--a)}.lv.Advanced{border-color:var(--v)}
.note{border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--mut);margin-bottom:16px}
.tags span{display:inline-block;font-size:10px;background:var(--bg2);border-radius:3px;padding:1px 7px;margin:0 4px 4px 0;color:var(--mut)}
.card ul,.pan ul,.pan ol{margin:6px 0 10px;padding-left:18px;color:var(--mut);font-size:12px}.pan h3{margin-top:12px}
pre{margin:6px 0;padding:12px;background:var(--bg2);border-radius:6px;overflow-x:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.two2{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.viz svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px}
.kv{font-size:12px;display:flex;gap:6px 20px;flex-wrap:wrap;margin:12px 0 6px}.kv b{font-weight:600}.seg{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.back{margin-bottom:14px}details{margin:6px 0;font-size:12px;color:var(--mut)}summary{cursor:pointer;color:var(--ink)}
@media (max-width:820px){.two2{grid-template-columns:1fr}}
@media (max-width:1180px){.wrap.two{grid-template-columns:minmax(0,1fr)}aside{border-left:0;border-top:1px solid var(--line)}.hero{grid-template-columns:minmax(0,1fr) 300px}.cap{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.shell{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav .n{width:auto;white-space:nowrap}.foot{display:none}.hero{grid-template-columns:1fr}h1{font-size:32px}.stats{flex-wrap:wrap;gap:22px}.leg{margin:0;width:100%}.pg{grid-template-columns:1fr}.sub,.hl button:first-child{display:none}header{gap:12px;padding:0 14px}main{padding:20px 14px 36px}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.hl{gap:8px}}

.reader-content{margin-top:16px;max-height:min(68vh,760px);overflow:auto;border-top:1px solid var(--line);padding-top:16px;color:var(--ink);line-height:1.65}.reader-content h1,.reader-content h2,.reader-content h3,.reader-content h4{margin:18px 0 8px}.reader-content p,.reader-content ul,.reader-content ol{margin:8px 0}.reader-content pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:1.55}.reader-content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.reader-content .reader-code,.reader-content .reader-md{margin-bottom:14px}.reader-content a{color:inherit;text-decoration:underline}
</style></head><body>

const V={
home:()=>`<div class="hero"><div><div class="eb">International Olympiad in AI</div><h1>Your IOAI journey<br>starts here</h1><p>Build your AI skills with structured learning, hands-on practice, interactive notebooks and real competition-style problems. Get ready for IOAI and other AI Olympiads.</p><button class="btn p" data-go="path">Start Learning ${ic("arrow").replace('class="i "','style="width:13px;height:13px" class="i"')}</button> <button class="btn" data-go="path" style="margin-left:6px">Explore Modules</button></div>${art}<div class="cap"><h3>IOAI 2026</h3><div style="margin:8px 0 18px">Learn · Practice · Compete</div><hr style="border:0;border-top:1px solid var(--line)"><div style="margin-top:16px;line-height:1.8">From foundations to competition level — your AI journey, powered by Think 42 Lab.</div></div></div>

<div class="sec"><div><h2>Learning Path</h2><p>Follow the structured IOAI syllabus and build your skills step by step.</p></div><button class="link" data-go="path">View full path ${ic("arrow")}</button></div><div class="grid">${MODS.map(modCard).join("")}</div>

document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k==null||!S.did)return;const key="pa."+S.did,a=ls.g(key,[]).filter(x=>x!==+k);if(e.target.checked)a.push(+k);ls.s(key,a)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-seg],[data-reset],[data-n],[data-copy]");if(!b)return;const d=b.dataset;if(d.seg){const i=d.seg.indexOf(":");sv(D.sim.find(s=>s.id===S.did))[d.seg.slice(0,i)]=d.seg.slice(i+1);return route()}if(d.reset){delete S.sv[S.did];return route()}if(d.copy)return cp($("#code").textContent);const n=d.n,id=S.did,k="runs."+id,R=ls.g(k,[]);if(n==="copyruns")return R.length?cp(JSON.stringify(R,null,2)):toast("No runs to copy yet.");if(n.startsWith("delrun:")){R.splice(+n.split(":")[1],1);ls.s(k,R);return route()}if(n==="saverun"){const rec={experiment_id:id,metrics:{}};document.querySelectorAll("[data-r]").forEach(i=>{const f=i.dataset.r,v=i.value.trim();if(f.startsWith("m-")){if(v)rec.metrics[f.slice(2)]=v}else rec[f]=v});if(!rec.run_name)return toast("Enter a run name first.");R.push(rec);ls.s(k,R);route();toast("Run saved in this browser.")}});

/* Data-driven curriculum and resources */
const rawPath=p=>{const u=String(p||"");return u.startsWith("http://")||u.startsWith("https://")?u:RAW.slice(0,RAW.length-"app-data/".length)+(u.startsWith("/")?u.slice(1):u)};
const resourceHref=item=>{const u=String(item.url||"");return u.startsWith("http://")||u.startsWith("https://")?u:rawPath(u)};
const pathTrackCard=t=>`<button class="card" data-go="path.${e2(t.id)}"><span class="ic">${ic(t.icon==="triangle"?"math":t.icon==="image"?"image":t.icon==="brain"?"ml":"code")}</span>${ic("arrow","go")}<h3>${e2(t.title)}</h3><p>${e2(t.description)}</p><div class="meta">${(t.modules||[]).length} modules · ${(t.modules||[]).filter(m=>m.lesson_path).length} lessons available</div></button>`;
const readLink=(path,label)=>`<button class="btn sm2" data-read="${e2(rawPath(path))}" data-read-title="${e2(label)}">${e2(label)}</button>`;
const pathModuleCard=(m)=>{const links=[];
 if(m.lesson_path)links.push(readLink(m.lesson_path,"Read lesson"));
 if(m.quiz_path)links.push(readLink(m.quiz_path,"Take quiz"));
 if(m.exercises_path)links.push(readLink(m.exercises_path,"View exercises"));
 if(m.notebook_path)links.push(readLink(m.notebook_path,"Preview notebook"),A(COLAB+m.notebook_path,"Open in Colab"));
 (m.resource_urls||[]).forEach((u,i)=>links.push(A(u,"Reference "+(i+1))));
 if(m.notebook_library_id){const n=D.nb.find(x=>x.id===m.notebook_library_id);if(n&&n.notebook_path)links.push(readLink(n.notebook_path,"Preview notebook"),A(COLAB+n.notebook_path,"Open in Colab"));}
 return `<article class="card"><div>${lvl(m.level||"Beginner")}<span class="meta">${Number.isFinite(m.estimated_minutes)?m.estimated_minutes+" min":""}</span></div><h3 style="margin-top:8px">${e2(m.title)}</h3><p>${e2(m.description)}</p>${li(m.outcomes)}<div class="row" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${links.join("")||'<span class="meta">No linked lesson file yet.</span>'}</div>${m.content_status==="external-reference"?'<div class="meta" style="margin-top:8px">Supplementary external reference; no local lesson file is included.</div>':""}</article>`;
};
V.home=()=>`<div class="hero"><div><div class="eb">International Olympiad in AI</div><h1>Your IOAI journey<br>starts here</h1><p>Build your AI skills with structured learning, hands-on practice, interactive notebooks and real competition-style problems. Get ready for IOAI and other AI Olympiads.</p><button class="btn p" data-go="path">Start Learning ${ic("arrow").replace('class="i "','style="width:13px;height:13px" class="i"')}</button> <button class="btn" data-go="resources" style="margin-left:6px">Explore Resources</button></div>${art}<div class="cap"><h3>IOAI 2026</h3><div style="margin:8px 0 18px">Learn · Practice · Compete</div><hr style="border:0;border-top:1px solid var(--line)"><div style="margin-top:16px;line-height:1.8">From foundations to competition level — your AI journey, powered by Think 42 Lab.</div></div></div><div class="stats"><div><b>${D.exp.length}</b><span>Experiments</span></div><div><b>${D.pa.length}</b><span>Practice Problems</span></div><div><b>${D.nb.length}</b><span>Notebooks</span></div><div><b>${D.sim.length}</b><span>Simulations</span></div><div class="leg"><span><i style="background:var(--g)"></i>Beginner</span><span><i style="background:var(--a)"></i>Intermediate</span><span><i style="background:var(--v)"></i>Advanced</span></div></div><div class="sec"><div><h2>Learning Path</h2><p>Follow the structured IOAI syllabus step by step.</p></div><button class="link" data-go="path">View full path ${ic("arrow")}</button></div><div class="grid">${(D.path.tracks||[]).map(pathTrackCard).join("")}</div><div class="sec"><div><h2>Featured Notebooks</h2><p>Guided notebooks for practical AI and IOAI preparation.</p></div><button class="link" data-go="notebooks">View all notebooks ${ic("arrow")}</button></div><div class="g2">${D.nb.slice(0,4).map(nbFull).join("")}</div>`;
V.path=()=>{const all=D.path.tracks||[];if(S.did){const module=all.flatMap(t=>(t.modules||[]).map(m=>({...m,track:t.title}))).find(m=>m.id===S.did);if(module)return `<div class="page">${back("path","Learning Path")}${head(e2(module.title),e2(module.track)+" · "+e2(module.level||""))}<p class="mut">${e2(module.description)}</p>${li(module.outcomes)}<div class="g2">${pathModuleCard(module)}</div></div>`;const track=all.find(t=>t.id===S.did);if(track)return `<div class="page">${back("path","Learning Path")}${head(e2(track.title),e2(track.description))}<div class="g2">${(track.modules||[]).map(pathModuleCard).join("")}</div></div>`;}
return `<div class="page">${head(D.path.title||"Learning Path",D.path.description||"Follow the structured IOAI syllabus step by step.")}<div class="grid">${all.map(pathTrackCard).join("")}</div><div class="note">Open a track to see its modules. Local lesson, quiz, exercise, and notebook links open the corresponding repository files. Modules labelled as external references do not have a local lesson file.</div></div>`;};
V.resources=()=>`<div class="page">${head(D.res.title||"Resources",D.res.description||"Reference material for IOAI preparation.")}${(D.res.categories||[]).map(c=>`<section style="margin-bottom:24px"><div class="sec"><div><h2>${e2(c.title)}</h2><p>${e2(c.description)}</p></div><span class="meta">${(c.items||[]).length} resources</span></div><div class="list">${(c.items||[]).map(item=>`<div class="li card" style="padding:14px 16px;text-decoration:none;color:inherit"><span class="ic" style="margin:0">${ic("file")}</span><div class="g"><h3>${e2(item.title)}</h3><div class="meta" style="margin:0">${e2(item.description)}</div><div class="meta">${e2(item.provider||item.type||"Resource")}${item.attribution?" · "+e2(item.attribution):""}</div></div>${String(item.url||"").startsWith("olympiad-tasks/")?readLink(item.url,item.title.includes("Index")?"View index":"View material"):A(resourceHref(item),"Open source ↗")}</div>`).join("")}</div></section>`).join("")}<div class="note">Official competition materials link to their original sources. Supplementary resources are provided for learning; availability and terms are controlled by their providers.</div></div>`;


/* In-site reader for repository lessons, quizzes, exercises, notebooks and task indexes. */
const mdHtml=src=>{const lines=String(src||"").replace(/\r/g,"").split("\n");let out="",para=[],list="",code=false,cb=[];
const flush=()=>{if(para.length){out+="<p>"+para.map(esc).join("<br>")+"</p>";para=[]}};
const endList=()=>{if(list){out+="</"+list+">";list=""}};
for(const line of lines){if(line.trim().startsWith("```")){flush();endList();if(code){out+="<pre><code>"+esc(cb.join("\n"))+"</code></pre>";cb=[];code=false}else code=true;continue}if(code){cb.push(line);continue}if(!line.trim()){flush();endList();continue}const h=line.match(/^(#{1,4})\s+(.*)$/);if(h){flush();endList();out+="<h"+h[1].length+">"+esc(h[2])+"</h"+h[1].length+">";continue}const lii=line.match(/^\s*[-*]\s+(.*)$/);if(lii){flush();if(list!=="ul"){endList();out+="<ul>";list="ul"}out+="<li>"+esc(lii[1])+"</li>";continue}const oi=line.match(/^\s*\d+[.)]\s+(.*)$/);if(oi){flush();if(list!=="ol"){endList();out+="<ol>";list="ol"}out+="<li>"+esc(oi[1])+"</li>";continue}flush();endList();para.push(line.trim())}flush();endList();if(code)out+="<pre><code>"+esc(cb.join("\n"))+"</code></pre>";return out};
const notebookHtml=data=>(data.cells||[]).map((c,i)=>{const src=Array.isArray(c.source)?c.source.join(""):String(c.source||"");return c.cell_type==="markdown"?`<section class="reader-md">${mdHtml(src)}</section>`:`<section class="reader-code"><div class="meta">Code cell ${i+1}</div><pre><code>${esc(src)}</code></pre></section>`}).join("")||"<p>This notebook has no cells.</p>";
async function openContent(url,title){modal(esc(title),'<div class="meta">Loading study material…</div>',"",null);const m=document.querySelector(".modal:last-child");if(!m)return;try{const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const txt=await res.text();let content;if(url.endsWith(".ipynb"))content=notebookHtml(JSON.parse(txt));else if(url.endsWith(".json"))content="<pre><code>"+esc(JSON.stringify(JSON.parse(txt),null,2))+"</code></pre>";else if(url.endsWith(".md")||url.endsWith("README.md"))content=mdHtml(txt);else content="<pre><code>"+esc(txt)+"</code></pre>";const box=m.querySelector(".mb");box.insertAdjacentHTML("beforeend",'<div class="reader-content">'+content+'</div>')}catch(err){const box=m.querySelector(".mb");box.insertAdjacentHTML("beforeend",'<p class="mut">Could not load this file inside the website. Check your connection.</p><p><a target="_blank" rel="noopener" href="'+esc(url)+'">Open original file</a></p>')}}

/*END*/
route();
</script></body></html>
